<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sigint Ops</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand" aria-label="Brand icon">
          <img src="image-removebg-preview.png" alt="Sigint Ops logo" />
        </div>

        <div class="title">SIGINT OPS</div>

        <div class="status-pill" aria-label="Secure online status">
          <span class="status-dot"></span>
          <span>SECURE • ONLINE</span>
        </div>
      </header>

      <main class="workspace-panel">
        <div class="brand-icon">
          <div class="radar-wrap">
            <div class="radar">
              <div class="radar-glow"></div>
              <div class="sweep"></div>
              <div class="crosshair crosshair-vertical"></div>
              <div class="crosshair crosshair-horizontal"></div>
              <div class="signal signal-1"></div>
              <div class="signal signal-2"></div>
              <div class="signal signal-3"></div>
              <div class="signal signal-4"></div>
            </div>
          </div>

          <div class="stats">
            <div class="metric">
              <div class="value">24</div>
              <div class="label">ACTIVE SIGNALS</div>
            </div>
            <div class="metric">
              <div class="value secondary">07</div>
              <div class="label">PRIORITY ALERTS</div>
            </div>
          </div>
        </div>

        <div class="action-row" aria-label="Primary actions">
          <button class="action-btn" type="button">
            <span class="btn-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 15.5L14.5 6H9V4h9v9h-2V8.5L8.5 18H5v-2.5Z"/>
              </svg>
            </span>
            <span>New Brief</span>
          </button>

          <button class="action-btn" type="button">
            <span class="btn-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 5.5 3.5 12 9 18.5M15 5.5 20.5 12 15 18.5M13.5 3.5l-3 17"/>
              </svg>
            </span>
            <span>Decode</span>
          </button>

          <button class="action-btn" type="button">
            <span class="btn-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 16.5h8M7 7.5h10M8.5 4.5h7l2.5 3v9.5c0 1.1-.9 2-2 2h-8c-1.1 0-2-.9-2-2V7.5l2.5-3Zm2.5 12.5v2m4-2v2"/>
              </svg>
            </span>
            <span>Request Drone</span>
          </button>
        </div>

        <div class="task-grid" aria-label="Operations overview">
          <div class="task-item">
            <input class="task-radio" type="radio" name="task" id="task-nightfall" checked />
            <label class="task-card critical" for="task-nightfall" aria-label="Operation Nightfall card">
              <div class="task-header">
                <span class="task-tag">CRITICAL</span>
                <span class="task-status">In Progress</span>
              </div>
              <h3>Operation Nightfall</h3>
              <div class="progress"><span style="width: 65%"></span></div>
              <div class="progress-meta"><span>65%</span></div>
            </label>
          </div>

          <div class="task-item">
            <input class="task-radio" type="radio" name="task" id="task-alpha" />
            <label class="task-card warning" for="task-alpha" aria-label="Signal Intercept Alpha card">
              <div class="task-header">
                <span class="task-tag">HIGH</span>
                <span class="task-status">Analyzing</span>
              </div>
              <h3>Signal Intercept Alpha</h3>
              <div class="progress"><span style="width: 40%"></span></div>
              <div class="progress-meta"><span>40%</span></div>
            </label>
          </div>

          <div class="task-item">
            <input class="task-radio" type="radio" name="task" id="task-recovery" />
            <label class="task-card neutral" for="task-recovery" aria-label="Asset Recovery card">
              <div class="task-header">
                <span class="task-tag">MEDIUM</span>
                <span class="task-status">Pending</span>
              </div>
              <h3>Asset Recovery</h3>
              <div class="progress"><span style="width: 15%"></span></div>
              <div class="progress-meta"><span>15%</span></div>
            </label>
          </div>

          <div class="task-item">
            <input class="task-radio" type="radio" name="task" id="task-grid" />
            <label class="task-card active" for="task-grid" aria-label="Cyber Defense Grid card">
              <div class="task-header">
                <span class="task-tag">HIGH</span>
                <span class="task-status success">Active</span>
              </div>
              <h3>Cyber Defense Grid</h3>
              <div class="progress"><span style="width: 80%"></span></div>
              <div class="progress-meta"><span>80%</span></div>
            </label>
          </div>
        </div>

        <div class="threat-banner" role="alert">
          <span class="banner-dot"></span>
          <span>THREAT DETECTED</span>
        </div>
      </main>

      <footer class="bottom-nav" aria-label="Secondary navigation">
        <div class="nav-item active">
          <span class="nav-icon">⌁</span>
          <span>Dashboard</span>
        </div>
        <div class="nav-item">
          <span class="nav-icon">◌</span>
          <span>Feed</span>
        </div>
        <div class="nav-item">
          <span class="nav-icon">▣</span>
          <span>Brief</span>
        </div>
      </footer>
    </div>

  </body>
</html>
